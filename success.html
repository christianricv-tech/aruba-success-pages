<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected - Madrid Guest WiFi</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #222;
        }

        .card {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 40px 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .check {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #00aef0;
            color: white;
            font-size: 42px;
            line-height: 70px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 26px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .duration {
            margin-top: 25px;
            padding: 15px;
            background: #f1f8fc;
            border-radius: 10px;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="check">✓</div>

        <h1>Successfully Connected!</h1>

        <p>
            Welcome to <strong>Madrid Guest WiFi</strong>.
        </p>

        <p>
            Your internet access is now active.
        </p>

        <div class="duration">
            ⏱ Your session is valid for 2 hours.
        </div>

        <p>
            Enjoy your stay!
        </p>

        <div class="footer">
            Madrid IT Department<br>
            Authorized Guest Access
        </div>

    </div>

</body>
</html>
